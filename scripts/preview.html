<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#0e1012;font-family:system-ui}
 /* The padding and background live on .col, not body: preview.mjs screenshots
    THIS element so the shot is cropped to the content, and an element shot
    captures only the element's own box — padding here is what keeps the result
    from being flush against the chips on every side. inline-flex so it shrinks
    to fit rather than stretching to the viewport it is measured in. */
 .col{display:inline-flex;gap:36px;align-items:flex-start;background:#0e1012;padding:40px}
 .stack{display:flex;flex-direction:column;gap:12px;align-items:flex-start}</style>
<div class="col"><div class="stack" id="chips"></div><div id="panelhost"></div></div>
<script type="module">
  import { CSS, INDICATOR_ID } from '/userscript/src/theme.mjs';
  import { createIndicator } from '/userscript/src/indicator.mjs';
  import { createSettingsPanel } from '/userscript/src/panel.mjs';

  const style = document.createElement('style');
  // The chip positions itself against the viewport; pin it flat so several can
  // be laid out side by side for comparison.
  style.textContent = CSS + `#${INDICATOR_ID}{position:static !important;transform:none !important;}`;
  document.head.appendChild(style);

  const chips = document.getElementById('chips');
  for (const state of ['synced', 'syncing', 'reload', 'conflict', 'offline', 'unconfigured', 'update']) {
    const ind = createIndicator({});
    const el = ind.element ?? ind;
    ind.setState(state, 'Revision 93');
    // The id stays: every rule in the sheet is scoped to #psnppp-indicator, so
    // stripping it renders unstyled text. Several nodes share the id here,
    // which is invalid but harmless in a preview that never queries by id.
    chips.appendChild(el);
  }

  // Read the real version rather than restating it. A hardcoded string here goes
  // stale on the next release and the preview then advertises a version that was
  // never shipped — which it did, sitting at 2.3.26 well past it.
  const version = await fetch('/package.json').then(r => r.json()).then(p => p.version);

  const panel = createSettingsPanel({
    config: { endpoint: 'https://trippixn.com/api/psnppp', key: 'stored' },
    backups: [{ at: Date.now() - 3600e3 }],
    history: [{ at: Date.now() - 120e3, revision: 93, delta: { gamesRemoved: 1 } }],
    describeDelta: () => '-1 game',
    version,
    serverHistory: [
      { revision: 99, updatedAt: Date.now() - 3600e3, size: 4339 },
      { revision: 98, updatedAt: Date.now() - 4000e3, size: 3790 },
      { revision: 97, updatedAt: Date.now() - 4400e3, size: 3256 }
    ]
  });
  const pel = panel.element ?? panel;
  // Open on the Backups tab, which is what this preview is for.
  const tab = pel.querySelector('[data-psnppp="tab-backups"]');
  if (tab) tab.click();
  pel.style.position = 'static';
  document.getElementById('panelhost').appendChild(pel);

  window.__ready = true;
</script>
