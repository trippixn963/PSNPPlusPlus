# PSNP++ list sync — private API, one user, secret in the X-Sync-Key header.
#
# no-store matters: this is mutable state, not the cacheable read-only data the
# neighbouring /api/neighbour/ block serves. A cached 200 here would hand a client
# a stale revision and cause a needless 409 on every push.
location /api/psnppp/ {
    proxy_pass http://127.0.0.1:8091/api/psnppp/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
