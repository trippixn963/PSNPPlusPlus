# Installed to /etc/psnppp/nginx/locations.conf and pulled into the vhost with
# a single `include /etc/psnppp/nginx/*.conf;` — see DEPLOY.md, "The proxy", for
# why the glob is load-bearing rather than stylistic. This file is the canonical
# copy; edit it here, then reinstall. Do not paste these blocks into a vhost
# that other services share.
#
# PSNP++ userscript, served for Tampermonkey auto-update.
#
# `root /var/www/psnppp` is the whole point of these two blocks and must not be
# "tidied" back to the site root. Until 2026-08-09 the artifacts sat in
# /var/www/trippixn.com/ alongside the portfolio build; a full-sync portfolio
# deploy (rsync --delete) deleted them as extraneous and 404'd the install URL.
# That failure is silent — Tampermonkey reads a 404 as "no update available", so
# every install freezes on old code while reporting itself up to date.
#
# The public URLs are fixed forever: they are compiled into every copy already
# installed out there. Move the bytes if you like; never move the URLs.
#
# .meta.js is the metadata block alone — it is what Tampermonkey polls, so it
# must never be cached or update checks would keep reading a stale @version.
#
# The security headers are repeated in both blocks and that is not redundant:
# nginx does NOT merge server-level add_header into a location that declares any
# add_header of its own, so the moment these blocks set Cache-Control they lose
# every inherited header. Without the repeat, these two URLs are the only ones on
# the site served with no nosniff and no framing policy. Keep them in sync with
# the server-level set. (No CSP: it governs documents, and these are raw scripts
# fetched by a userscript manager, not pages.)
#
# default_type is deliberately absent — mime.types already maps .js.
location = /psnppp.user.js {
    root /var/www/psnppp;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}

location = /psnppp.meta.js {
    root /var/www/psnppp;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}

# PSNP++ list sync — private API, one user, secret in the X-Sync-Key header.
#
# no-store matters: this is mutable state, not cacheable read-only data. A
# cached 200 here would hand a client a stale revision and cause a needless 409
# on every push.
location /api/psnppp/ {
    # A whole PSNP+ list set is a few hundred KB at most, so 4m is generous.
    # The route is auth-gated, but nginx buffers the request body before it ever
    # reaches the app — so without a cap, an unauthenticated caller can make
    # this host spool an arbitrarily large upload to disk before the 401 that
    # was always going to reject it. Costs nothing legitimate to refuse.
    client_max_body_size 4m;

    proxy_pass http://127.0.0.1:8091/api/psnppp/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
