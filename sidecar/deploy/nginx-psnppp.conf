# PSNP++ list sync — private API, one user, secret in the X-Sync-Key header.
#
# no-store matters: this is mutable state, not the cacheable read-only data the
# neighbouring /api/neighbour/ block serves. A cached 200 here would hand a client
# a stale revision and cause a needless 409 on every push.
location /api/psnppp/ {
    # A whole PSNP+ list set is a few hundred KB at most, so 4m is generous.
    # The route is auth-gated, but nginx buffers the request body before it ever
    # reaches the app — so without a cap, an unauthenticated caller can make
    # this host spool an arbitrarily large upload to disk before the 401 that
    # was always going to reject it. Costs nothing legitimate to refuse.
    client_max_body_size 4m;

    proxy_pass http://127.0.0.1:8091/api/psnppp/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
